name: Cleanup formatting capture
on:
  push:
    branches: [integration/standalone-registry-template]
    paths: ['.github/workflows/temp-cleanup-format.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print formatted source
        run: |
          ./node_modules/.bin/vp check --fix || true
          echo FORMAT_HELPER_START
          base64 -w 0 tests/helpers/registry-template.ts
          echo
          echo FORMAT_HELPER_END
          echo FORMAT_INIT_START
          base64 -w 0 tests/registry-init.test.ts
          echo
          echo FORMAT_INIT_END
