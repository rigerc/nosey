name: Temporary format capture
on:
  push:
    branches: [integration/standalone-registry-template]
    paths:
      - '.github/workflows/temp-format.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Produce formatting
        run: |
          ./node_modules/.bin/vp check --fix
          echo FORMAT_START
          base64 -w 0 tests/registry-standalone-template.integration.test.ts
          echo
          echo FORMAT_END
