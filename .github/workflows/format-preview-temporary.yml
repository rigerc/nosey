name: Format preview (temporary)
on:
  push:
    branches:
      - feat/registry-template-upgrade
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Show formatter changes
        run: |
          npm run check -- --fix || true
          git diff -- src/lib/registry/template.ts src/lib/registry/upgrade.ts tests/registry-upgrade.test.ts
