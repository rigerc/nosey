name: Verify and format preview (temporary)
on:
  pull_request:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Print exact format diff
        run: |
          npm run check -- --fix || true
          git diff -- tests/registry-upgrade.test.ts
      - name: Type check diagnostics
        run: npm run typecheck
      - name: Test diagnostics
        run: npm run test
