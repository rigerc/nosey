name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint -- --deny-warnings
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node dist/cli.js --plain
      - run: node dist/cli.js doctor --json
      - run: node dist/cli.js scan . --json
      - run: npm run docs:schema:check
      - run: npm run schema:technologies:check
      - run: npm run registry:package:check
