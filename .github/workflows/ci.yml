name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node dist/cli.js --plain
      - run: node dist/cli.js --screen gallery --plain
      - run: node dist/cli.js doctor --json
      - run: node dist/cli.js scan . --json
      - run: node dist/cli.js registry validate templates/registry --json
