name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint -- --deny-warnings
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node dist/cli.js --plain
      - run: node dist/cli.js doctor --json
      - run: node dist/cli.js scan . --json
      - run: npm run docs:schema:check
      - run: npm run registry:template:check
      - run: node dist/cli.js registry validate templates/registry --json | node scripts/assert-registry-valid.mjs
      - name: Packaged template resolves from the built CLI
        run: |
          node dist/cli.js registry init "$RUNNER_TEMP/reg" --registry-id acme/x --yes --no-git
          test -f "$RUNNER_TEMP/reg/schemas/skills-manifest.schema.json"
          test -f "$RUNNER_TEMP/reg/schemas/skills-map.schema.json"
          cd "$RUNNER_TEMP/reg"
          node scripts/generate-manifest.mjs --check
          node scripts/generate-readme.mjs --check
