name: Update Nosey manifest

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'registry.json'
      - 'scripts/generate-manifest.mjs'
  pull_request:
    paths:
      - 'skills/**'
      - 'registry.json'
      - 'scripts/generate-manifest.mjs'
      - 'skills-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate manifest
        run: node scripts/generate-manifest.mjs
      - name: Verify on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- skills-manifest.json
      - name: Commit generated manifest
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- skills-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skills-manifest.json
            git commit -m "chore: regenerate skills manifest"
            git push
          fi
